<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#F4DF9F"/>
      <stop offset="100%" stop-color="#AA8232"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#g6)"/>
  <rect x="15" y="15" width="470" height="370" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Illustration: Sister's Cherished Childhood to Young Womanhood -->
  <circle cx="250" cy="175" r="115" fill="#FAF5ED" stroke="#7A8F78" stroke-width="0.8"/>

  <!-- Golden Heart & Floral Wreath -->
  <path d="M250 145 C230 110, 180 120, 180 160 C180 200, 250 240, 250 240 C250 240, 320 200, 320 160 C320 120, 270 110, 250 145 Z" fill="#EAEFEA" stroke="url(#goldH)" stroke-width="2"/>
  
  <!-- Tiny feet / Childhood toy to Half Saree transition motif -->
  <g transform="translate(250, 175)">
    <!-- Small sparklers/stars of joy -->
    <path d="M0 -20 L3 -8 L15 -5 L5 4 L8 16 L0 8 L-8 16 L-5 4 L-15 -5 L-3 -8 Z" fill="#C5A059" opacity="0.8"/>
    <!-- Twin jasmine flower accents -->
    <circle cx="-30" cy="0" r="8" fill="#FFFFFF" stroke="#C5A059" stroke-width="1"/>
    <circle cx="-30" cy="0" r="2.5" fill="#D4AF37"/>
    <circle cx="30" cy="0" r="8" fill="#FFFFFF" stroke="#C5A059" stroke-width="1"/>
    <circle cx="30" cy="0" r="2.5" fill="#D4AF37"/>
  </g>

  <!-- Small text banner -->
  <rect x="70" y="320" width="360" height="40" rx="20" fill="#FFFFFF" stroke="#4A5D4E" stroke-width="0.8"/>
  <text x="250" y="345" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" fill="#4A5D4E" font-weight="600" letter-spacing="1.5">CHERISHED SMILES & CHILDHOOD MEMORIES</text>
</svg>
