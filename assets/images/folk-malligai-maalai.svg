<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="folkCreamBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F3ECE0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="480" fill="url(#folkCreamBg3)"/>

  <!-- Minimalist Folk Border -->
  <rect x="24" y="24" width="552" height="432" fill="none" stroke="#4A5D4E" stroke-width="1.5"/>
  <rect x="32" y="32" width="536" height="416" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Corner Kolam accents -->
  <g stroke="#C5A059" stroke-width="1.2" fill="none">
    <path d="M42 42 L56 42 M42 42 L42 56"/><circle cx="46" cy="46" r="2.5" fill="#C5A059"/>
    <path d="M558 42 L544 42 M558 42 L558 56"/><circle cx="554" cy="46" r="2.5" fill="#C5A059"/>
    <path d="M42 438 L56 438 M42 438 L42 424"/><circle cx="46" cy="434" r="2.5" fill="#C5A059"/>
    <path d="M558 438 L544 438 M558 438 L558 424"/><circle cx="554" cy="434" r="2.5" fill="#C5A059"/>
  </g>

  <!-- Central Circular Halo -->
  <circle cx="300" cy="205" r="125" fill="#EEF4EC" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Folk Art: Madurai Jasmine (Mallipoo) Garland &amp; Lotus (Thamaraipoo) -->
  <g transform="translate(300, 205)">
    <!-- Curving Wreath of Jasmine Garlands -->
    <path d="M-100 20 C-110 90, 110 90, 100 20" fill="none" stroke="#C5A059" stroke-width="2"/>
    <path d="M-85 10 C-95 70, 95 70, 85 10" fill="none" stroke="#7A8F78" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Strung Jasmine Buds (Malligai Arumbu) along garland -->
    <g fill="#FFFFFF" stroke="#4A5D4E" stroke-width="1">
      <ellipse cx="-95" cy="30" rx="9" ry="6" transform="rotate(-30 -95 30)"/>
      <ellipse cx="-75" cy="55" rx="9" ry="6" transform="rotate(-15 -75 55)"/>
      <ellipse cx="-50" cy="72" rx="9" ry="6" transform="rotate(0 -50 72)"/>
      <ellipse cx="-20" cy="80" rx="9" ry="6" transform="rotate(10 -20 80)"/>
      <ellipse cx="10" cy="80" rx="9" ry="6" transform="rotate(-10 10 80)"/>
      <ellipse cx="40" cy="74" rx="9" ry="6" transform="rotate(5 40 74)"/>
      <ellipse cx="70" cy="58" rx="9" ry="6" transform="rotate(20 70 58)"/>
      <ellipse cx="92" cy="32" rx="9" ry="6" transform="rotate(35 92 32)"/>

      <!-- Inner layer buds with golden center -->
      <circle cx="-65" cy="40" r="5" fill="#FDFBF7"/>
      <circle cx="-35" cy="56" r="5" fill="#FDFBF7"/>
      <circle cx="-5" cy="62" r="5.5" fill="#FDFBF7"/>
      <circle cx="25" cy="58" r="5" fill="#FDFBF7"/>
      <circle cx="55" cy="44" r="5" fill="#FDFBF7"/>
    </g>

    <!-- Traditional Central Pink Lotus Bloom (Thamarai) -->
    <g transform="translate(0, -20)">
      <!-- Outer petals -->
      <path d="M0 35 C-45 10, -50 -35, 0 -55 C50 -35, 45 10, 0 35 Z" fill="#E8A7B0" stroke="#8B263E" stroke-width="1.5"/>
      <!-- Middle petals -->
      <path d="M0 35 C-30 15, -35 -20, 0 -40 C35 -20, 30 15, 0 35 Z" fill="#F4CFD5" stroke="#8B263E" stroke-width="1.2"/>
      <!-- Inner petals -->
      <path d="M0 35 C-15 20, -18 -5, 0 -25 C18 -5, 15 20, 0 35 Z" fill="#FFFFFF" stroke="#8B263E" stroke-width="1"/>
      <!-- Golden lotus core -->
      <circle cx="0" cy="0" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#8B263E"/>
    </g>

    <!-- Sacred Green Tulsi / Mango Leaf Sprigs flanking the lotus -->
    <path d="M-60 -20 C-85 -35, -80 -60, -55 -45 Z" fill="#4A5D4E" stroke="#2D3A2F" stroke-width="1.2"/>
    <path d="M60 -20 C85 -35, 80 -60, 55 -45 Z" fill="#4A5D4E" stroke="#2D3A2F" stroke-width="1.2"/>
  </g>

  <!-- Editorial Folk Label Block -->
  <g transform="translate(300, 395)">
    <rect x="-190" y="-20" width="380" height="40" rx="20" fill="#FFFFFF" stroke="#4A5D4E" stroke-width="1"/>
    <text x="0" y="-3" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" fill="#4A5D4E" font-weight="700" letter-spacing="2">மல்லிகைப் பூ மாலை • MALLIGAI MAALAI</text>
    <text x="0" y="13" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8A6A2C" letter-spacing="1.2">Madurai Jasmine Garlands &amp; Sacred Lotus</text>
  </g>
</svg>
