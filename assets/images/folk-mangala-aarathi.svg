<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="folkCreamBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F3ECE0"/>
    </linearGradient>
    <linearGradient id="brassAarathi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECCF8B"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8A6A2C"/>
    </linearGradient>
    <radialGradient id="folkAarathiFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="480" fill="url(#folkCreamBg4)"/>

  <!-- Minimalist Folk Border -->
  <rect x="24" y="24" width="552" height="432" fill="none" stroke="#4A5D4E" stroke-width="1.5"/>
  <rect x="32" y="32" width="536" height="416" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Corner Kolam accents -->
  <g stroke="#C5A059" stroke-width="1.2" fill="none">
    <path d="M42 42 L56 42 M42 42 L42 56"/><circle cx="46" cy="46" r="2.5" fill="#C5A059"/>
    <path d="M558 42 L544 42 M558 42 L558 56"/><circle cx="554" cy="46" r="2.5" fill="#C5A059"/>
    <path d="M42 438 L56 438 M42 438 L42 424"/><circle cx="46" cy="434" r="2.5" fill="#C5A059"/>
    <path d="M558 438 L544 438 M558 438 L558 424"/><circle cx="554" cy="434" r="2.5" fill="#C5A059"/>
  </g>

  <!-- Central Circular Halo -->
  <circle cx="300" cy="205" r="125" fill="#FBF4EA" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Folk Art: Auspicious Brass Aarti Thali (ஆலத்தி தட்டு) -->
  <g transform="translate(300, 205)">
    <!-- Outer ornate brass plate -->
    <circle cx="0" cy="15" r="95" fill="url(#brassAarathi)" stroke="#5E4314" stroke-width="2"/>
    <circle cx="0" cy="15" r="85" fill="#F4DE97" stroke="#8A6A2C" stroke-width="1"/>
    
    <!-- Dotted rim pattern (Tanjore folk style) -->
    <circle cx="0" cy="15" r="80" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 4" fill="none"/>

    <!-- Sacred Red Turmeric-Kumkum Water (Aalathi Neer) -->
    <circle cx="0" cy="15" r="74" fill="#C53030" stroke="#7F1D1D" stroke-width="1.5"/>
    <circle cx="0" cy="15" r="68" fill="#DC2626" opacity="0.85"/>

    <!-- Central Brass Diya Lamp with Glowing Flame -->
    <g transform="translate(0, 5)">
      <!-- Flame glow -->
      <circle cx="0" cy="-22" r="22" fill="url(#folkAarathiFlame)" opacity="0.55"/>
      <!-- Outer flame -->
      <path d="M0 -36 C-8 -22, -6 -14, 0 -8 C6 -14, 8 -22, 0 -36 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
      <!-- Inner flame -->
      <path d="M0 -30 C-4 -20, -3 -15, 0 -10 C3 -15, 4 -20, 0 -30 Z" fill="#FEF08A"/>
      <!-- Brass oil lamp cup -->
      <ellipse cx="0" cy="-5" rx="22" ry="10" fill="url(#brassAarathi)" stroke="#5E4314" stroke-width="1.5"/>
      <ellipse cx="0" cy="-5" rx="16" ry="6" fill="#FDE68A"/>
    </g>

    <!-- Kumkum Bowl (Left) -->
    <g transform="translate(-40, 25)">
      <circle cx="0" cy="0" r="14" fill="url(#brassAarathi)" stroke="#5E4314" stroke-width="1"/>
      <circle cx="0" cy="0" r="10" fill="#991B1B"/> <!-- Sacred Red Kumkum -->
      <circle cx="0" cy="0" r="4" fill="#B91C1C"/>
    </g>

    <!-- Chandanam / Sandalwood Paste Bowl (Right) -->
    <g transform="translate(40, 25)">
      <circle cx="0" cy="0" r="14" fill="url(#brassAarathi)" stroke="#5E4314" stroke-width="1"/>
      <circle cx="0" cy="0" r="10" fill="#FDE68A"/> <!-- Sandalwood paste -->
      <circle cx="0" cy="0" r="3" fill="#991B1B"/> <!-- Kumkum center dot -->
    </g>

    <!-- Betel Leaves &amp; Areca Nut (Vethalai Paakku) in Thali -->
    <path d="M-15 48 C-25 35, -5 32, 0 45 Z" fill="#4A5D4E" stroke="#2D3A2F" stroke-width="1"/>
    <path d="M15 48 C25 35, 5 32, 0 45 Z" fill="#4A5D4E" stroke="#2D3A2F" stroke-width="1"/>
    <circle cx="0" cy="50" r="4.5" fill="#78350F"/> <!-- Paakku (Areca nut) -->
  </g>

  <!-- Editorial Folk Label Block -->
  <g transform="translate(300, 395)">
    <rect x="-190" y="-20" width="380" height="40" rx="20" fill="#FFFFFF" stroke="#4A5D4E" stroke-width="1"/>
    <text x="0" y="-3" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" fill="#4A5D4E" font-weight="700" letter-spacing="2">மங்கல ஆரத்தி • MANGALA AARATHI</text>
    <text x="0" y="13" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8A6A2C" letter-spacing="1.2">Auspicious Aarti &amp; Cherished Elders' Blessings</text>
  </g>
</svg>
