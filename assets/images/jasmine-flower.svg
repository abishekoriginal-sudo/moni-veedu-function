<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Delicate South Indian Mallipoo (Jasmine) Blossom -->
  <g transform="translate(40,40)">
    <!-- 8 delicate rounded elongated petals -->
    <path d="M0 0 C -7 -28, 7 -28, 0 0" fill="#FAF8F5" stroke="#D1C7B7" stroke-width="0.75"/>
    <path d="M0 0 C 20 -20, 28 -7, 0 0" fill="#FDFBF7" stroke="#D1C7B7" stroke-width="0.75"/>
    <path d="M0 0 C 28 -7, 28 7, 0 0" fill="#FAF8F5" stroke="#D1C7B7" stroke-width="0.75"/>
    <path d="M0 0 C 20 20, 7 28, 0 0" fill="#FDFBF7" stroke="#D1C7B7" stroke-width="0.75"/>
    <path d="M0 0 C -7 28, 7 28, 0 0" fill="#FAF8F5" stroke="#D1C7B7" stroke-width="0.75"/>
    <path d="M0 0 C -20 20, -28 7, 0 0" fill="#FDFBF7" stroke="#D1C7B7" stroke-width="0.75"/>
    <path d="M0 0 C -28 7, -28 -7, 0 0" fill="#FAF8F5" stroke="#D1C7B7" stroke-width="0.75"/>
    <path d="M0 0 C -20 -20, -7 -28, 0 0" fill="#FDFBF7" stroke="#D1C7B7" stroke-width="0.75"/>
    
    <!-- Central soft yellow-gold pistil -->
    <circle cx="0" cy="0" r="4.5" fill="#F5E4A8" stroke="#D4AF37" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#D4AF37"/>
    <!-- Gentle green sepals underneath -->
    <path d="M-3 2 C -12 16, -5 20, 0 0" fill="#7A8F78" opacity="0.6"/>
  </g>
</svg>
