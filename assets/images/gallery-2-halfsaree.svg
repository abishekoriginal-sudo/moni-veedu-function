<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>
    <linearGradient id="silkG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A5D4E"/>
      <stop offset="50%" stop-color="#67806C"/>
      <stop offset="100%" stop-color="#3D4E41"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#F4DF9F"/>
      <stop offset="100%" stop-color="#AA8232"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#g2)"/>
  <rect x="15" y="15" width="470" height="370" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Half Saree Fold & Gold Bangles Illustration -->
  <circle cx="250" cy="175" r="115" fill="#F4EFE6" stroke="#C5A059" stroke-width="0.8"/>
  
  <!-- Pleated silk folds -->
  <path d="M160 250 L200 110 L260 110 L220 250 Z" fill="url(#silkG)"/>
  <path d="M220 250 L260 110 L300 110 L260 250 Z" fill="#5F7563"/>
  <path d="M260 250 L300 110 L340 110 L300 250 Z" fill="url(#silkG)"/>
  
  <!-- Zari border on pleats -->
  <rect x="150" y="240" width="200" height="16" fill="url(#goldB)" rx="2"/>
  <line x1="150" y1="244" x2="350" y2="244" stroke="#7A5612" stroke-width="0.8"/>
  <line x1="150" y1="252" x2="350" y2="252" stroke="#7A5612" stroke-width="0.8"/>

  <!-- Stack of Traditional Gold Bangles (Valayal) -->
  <g transform="translate(250, 150)">
    <ellipse cx="-20" cy="0" rx="25" ry="35" fill="none" stroke="url(#goldB)" stroke-width="4"/>
    <ellipse cx="-10" cy="0" rx="25" ry="35" fill="none" stroke="#8B263E" stroke-width="3"/> <!-- Silk thread/ruby bangle -->
    <ellipse cx="0" cy="0" rx="25" ry="35" fill="none" stroke="url(#goldB)" stroke-width="5"/>
    <ellipse cx="10" cy="0" rx="25" ry="35" fill="none" stroke="#4A5D4E" stroke-width="3"/> <!-- Green glass bangle -->
    <ellipse cx="20" cy="0" rx="25" ry="35" fill="none" stroke="url(#goldB)" stroke-width="4"/>
  </g>

  <!-- Small text banner -->
  <rect x="70" y="320" width="360" height="40" rx="20" fill="#FFFFFF" stroke="#4A5D4E" stroke-width="0.8"/>
  <text x="250" y="345" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" fill="#4A5D4E" font-weight="600" letter-spacing="1.5">TRADITIONAL SILK & TEMPLE JEWELS</text>
</svg>
