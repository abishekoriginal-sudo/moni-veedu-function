<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#EED59B"/>
      <stop offset="100%" stop-color="#A98440"/>
    </linearGradient>
  </defs>
  <!-- Outer Dotted Ring -->
  <circle cx="60" cy="60" r="54" stroke="#C5A059" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Outer Solid Ring -->
  <circle cx="60" cy="60" r="48" stroke="url(#crestGold)" stroke-width="1.5"/>
  
  <!-- Inner Ring with small bead dots -->
  <circle cx="60" cy="60" r="43" stroke="#7A8F78" stroke-width="0.8" opacity="0.7"/>

  <!-- Floral Petals around the perimeter -->
  <g stroke="#C5A059" stroke-width="0.75" fill="#FAF7F2" opacity="0.85">
    <!-- Top & Bottom petals -->
    <path d="M60 7 C57 12, 63 12, 60 7 Z" />
    <path d="M60 113 C57 108, 63 108, 60 113 Z" />
    <!-- Left & Right petals -->
    <path d="M7 60 C12 57, 12 63, 7 60 Z" />
    <path d="M113 60 C108 57, 108 63, 113 60 Z" />
    <!-- Diagonals -->
    <path d="M22 22 C26 27, 27 26, 22 22 Z" />
    <path d="M98 22 C94 27, 93 26, 98 22 Z" />
    <path d="M22 98 C26 93, 27 94, 22 98 Z" />
    <path d="M98 98 C94 93, 93 94, 98 98 Z" />
  </g>

  <!-- Auspicious Kalasam / Diya / Floral Center Motif -->
  <path d="M60 30 C56 36, 54 44, 54 50 C54 56, 56 62, 60 62 C64 62, 66 56, 66 50 C66 44, 64 36, 60 30 Z" fill="#EADBC0" stroke="#C5A059" stroke-width="1"/>
  <!-- Leaf top of kalasam -->
  <path d="M60 27 C57 24, 60 20, 60 20 C60 20, 63 24, 60 27 Z" fill="#7A8F78"/>
  <path d="M57 28 C53 27, 52 23, 52 23 C52 23, 55 26, 57 28 Z" fill="#889E86"/>
  <path d="M63 28 C67 27, 68 23, 68 23 C68 23, 65 26, 63 28 Z" fill="#889E86"/>

  <!-- Base bowl -->
  <path d="M50 56 C50 68, 70 68, 70 56 Z" fill="#D4AF37" stroke="#A98440" stroke-width="1"/>
  <rect x="53" y="68" width="14" height="2" fill="#A98440" rx="1"/>

  <!-- Auspicious Tamil letter or monogram decorative ribbon below -->
  <path d="M42 78 C52 74, 68 74, 78 78 C74 84, 46 84, 42 78 Z" fill="#6B8069" opacity="0.85"/>
  <circle cx="60" cy="79" r="1.5" fill="#FAF7F2"/>

  <!-- Delicate Stars -->
  <circle cx="42" cy="48" r="1" fill="#C5A059"/>
  <circle cx="78" cy="48" r="1" fill="#C5A059"/>
  <circle cx="60" cy="92" r="1.2" fill="#C5A059"/>
</svg>
