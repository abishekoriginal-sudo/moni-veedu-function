<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#g3)"/>
  <rect x="15" y="15" width="470" height="370" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Illustration: Fresh Madurai Jasmine Garland & Lotus -->
  <circle cx="250" cy="175" r="115" fill="#EEF3ED" opacity="0.8"/>

  <!-- Curved garland string -->
  <path d="M150 200 C180 250, 320 250, 350 200" fill="none" stroke="#C5A059" stroke-width="1.5"/>
  <!-- Jasmine bud cluster along garland -->
  <g fill="#FFFFFF" stroke="#D3C9BC" stroke-width="0.8">
    <circle cx="160" cy="210" r="8"/><circle cx="175" cy="222" r="8"/><circle cx="192" cy="232" r="8"/>
    <circle cx="212" cy="238" r="8"/><circle cx="232" cy="242" r="8"/><circle cx="250" cy="243" r="8.5"/>
    <circle cx="268" cy="242" r="8"/><circle cx="288" cy="238" r="8"/><circle cx="308" cy="232" r="8"/>
    <circle cx="325" cy="222" r="8"/><circle cx="340" cy="210" r="8"/>
    <!-- Second layer -->
    <circle cx="180" cy="208" r="7"/><circle cx="200" cy="218" r="7"/><circle cx="220" cy="224" r="7"/>
    <circle cx="240" cy="227" r="7"/><circle cx="260" cy="227" r="7"/><circle cx="280" cy="224" r="7"/>
    <circle cx="300" cy="218" r="7"/><circle cx="320" cy="208" r="7"/>
  </g>

  <!-- Blooming Lotus Centerpiece -->
  <g transform="translate(250, 150)">
    <path d="M0 25 C-30 10, -35 -20, 0 -35 C35 -20, 30 10, 0 25 Z" fill="#E8B4B8" stroke="#C47D83" stroke-width="1.2"/>
    <path d="M0 25 C-20 15, -25 -10, 0 -25 C25 -10, 20 15, 0 25 Z" fill="#F4CFD2"/>
    <path d="M0 25 C-10 15, -12 -5, 0 -15 C12 -5, 10 15, 0 25 Z" fill="#FFF0F2"/>
    <!-- Yellow carpel -->
    <circle cx="0" cy="0" r="6" fill="#F6D365"/>
  </g>

  <!-- Small text banner -->
  <rect x="70" y="320" width="360" height="40" rx="20" fill="#FFFFFF" stroke="#4A5D4E" stroke-width="0.8"/>
  <text x="250" y="345" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" fill="#4A5D4E" font-weight="600" letter-spacing="1.5">MADURAI JASMINE & SACRED BLOOMS</text>
</svg>
