<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" fill="none">
  <defs>
    <linearGradient id="lampGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E8047"/>
      <stop offset="30%" stop-color="#E5CA85"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E8047"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="40%" stop-color="#FDB813"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Flame at top -->
  <circle cx="50" cy="18" r="14" fill="url(#flameGlow)" opacity="0.4"/>
  <path d="M50 8 C46 16, 44 20, 50 25 C56 20, 54 16, 50 8 Z" fill="#FFA500"/>
  <path d="M50 12 C48 16, 47 19, 50 23 C53 19, 52 16, 50 12 Z" fill="#FFF275"/>

  <!-- Annam / Peacock finial top -->
  <path d="M50 24 C48 27, 49 30, 50 30 C51 30, 52 27, 50 24 Z" fill="url(#lampGold)"/>
  <circle cx="50" cy="30" r="3" fill="url(#lampGold)"/>

  <!-- Top oil bowl (Thaalam) with 5 wicks -->
  <path d="M30 42 C30 35, 70 35, 70 42 C68 47, 32 47, 30 42 Z" fill="url(#lampGold)"/>
  <path d="M25 40 C22 36, 27 34, 30 40 Z" fill="#FFC107"/>
  <path d="M75 40 C78 36, 73 34, 70 40 Z" fill="#FFC107"/>

  <!-- Central decorative column / Stem -->
  <path d="M47 46 H53 V60 H47 Z" fill="url(#lampGold)"/>
  <!-- Middle decorative pot (Kumbam) -->
  <ellipse cx="50" cy="65" rx="8" ry="5" fill="url(#lampGold)"/>
  <circle cx="50" cy="65" r="2.5" fill="#FAF7F2" opacity="0.6"/>
  <path d="M47 70 H53 V95 H47 Z" fill="url(#lampGold)"/>
  
  <!-- Lower decorative tier / Ring -->
  <ellipse cx="50" cy="98" rx="14" ry="6" fill="url(#lampGold)"/>
  <ellipse cx="50" cy="98" rx="12" ry="4" stroke="#7A8F78" stroke-width="0.8"/>
  <path d="M46 104 H54 V125 H46 Z" fill="url(#lampGold)"/>

  <!-- Circular Pedestal Base -->
  <ellipse cx="50" cy="130" rx="18" ry="7" fill="url(#lampGold)"/>
  <path d="M32 130 C32 145, 68 145, 68 130 Z" fill="url(#lampGold)"/>
  <ellipse cx="50" cy="144" rx="25" ry="8" fill="url(#lampGold)"/>
  <ellipse cx="50" cy="148" rx="27" ry="5" fill="#886E38"/>
</svg>
