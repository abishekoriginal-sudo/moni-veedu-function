<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 40" fill="none">
  <!-- Delicate Antique Gold and Sage Floral Divider -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C5A059" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E5CA85" stop-opacity="1"/>
      <stop offset="75%" stop-color="#C5A059" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left horizontal tapering line -->
  <path d="M40 20 H195" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="195" cy="20" r="2" fill="#C5A059"/>
  <circle cx="140" cy="20" r="1.5" fill="#889E86"/>

  <!-- Right horizontal tapering line -->
  <path d="M305 20 H460" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="305" cy="20" r="2" fill="#C5A059"/>
  <circle cx="360" cy="20" r="1.5" fill="#889E86"/>

  <!-- Left curved flourish with leaves -->
  <path d="M205 20 C220 20, 230 14, 236 12 C232 18, 222 22, 210 20" fill="#7A8F78" opacity="0.8"/>
  <path d="M218 20 C228 20, 236 26, 240 28 C236 22, 226 20, 218 20" fill="#6B8069" opacity="0.7"/>

  <!-- Right curved flourish with leaves -->
  <path d="M295 20 C280 20, 270 14, 264 12 C268 18, 278 22, 290 20" fill="#7A8F78" opacity="0.8"/>
  <path d="M282 20 C272 20, 264 26, 260 28 C264 22, 274 20, 282 20" fill="#6B8069" opacity="0.7"/>

  <!-- Center Jasmine Flower Motif -->
  <g transform="translate(250, 20)">
    <!-- Petals -->
    <path d="M0 0 C-4 -12, 4 -12, 0 0" fill="#FAF7F2" stroke="#C5A059" stroke-width="0.8"/>
    <path d="M0 0 C-12 -4, -12 4, 0 0" fill="#FAF7F2" stroke="#C5A059" stroke-width="0.8"/>
    <path d="M0 0 C-4 12, 4 12, 0 0" fill="#FAF7F2" stroke="#C5A059" stroke-width="0.8"/>
    <path d="M0 0 C12 -4, 12 4, 0 0" fill="#FAF7F2" stroke="#C5A059" stroke-width="0.8"/>
    <!-- Diagonal petals -->
    <path d="M0 0 C-8 -8, -6 -10, 0 0" fill="#F4EFE6" stroke="#C5A059" stroke-width="0.7"/>
    <path d="M0 0 C8 -8, 6 -10, 0 0" fill="#F4EFE6" stroke="#C5A059" stroke-width="0.7"/>
    <path d="M0 0 C-8 8, -6 10, 0 0" fill="#F4EFE6" stroke="#C5A059" stroke-width="0.7"/>
    <path d="M0 0 C8 8, 6 10, 0 0" fill="#F4EFE6" stroke="#C5A059" stroke-width="0.7"/>
    <!-- Golden Core -->
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="1.5" fill="#FAF7F2"/>
  </g>
</svg>
